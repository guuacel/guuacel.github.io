<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF 工具 | PDF Tool</title>
  <meta name="description" content="浏览器端 PDF 合并、拆分和页面提取工具。">
  <link rel="icon" type="image/png" href="assets/img/avatar-placeholder.png">
  <link rel="stylesheet" href="assets/css/style.css?v=20260611-pdf-tool">
</head>
<body class="guide-body pdf-tool-body">
  <header class="guide-nav">
    <div class="container guide-nav-inner">
      <div class="guide-brand" id="pdfToolBrand">PDF 工具</div>
      <div class="guide-actions">
        <a class="guide-button" id="pdfToolHomeLink" href="index.html#tools">返回主页</a>
        <button class="guide-button" id="pdfToolLangToggle" type="button">English</button>
      </div>
    </div>
  </header>

  <main class="guide-main" id="pdfToolApp">
    <div class="container">
      <section class="guide-hero pdf-tool-hero">
        <div class="guide-eyebrow" id="pdfToolEyebrow">Browser PDF Tool</div>
        <h1 class="guide-title" id="pdfToolTitle">PDF 合并与拆分</h1>
        <p class="guide-summary" id="pdfToolSummary">本地处理 PDF 文件，适合论文、报告和材料整理。</p>
      </section>

      <section class="pdf-tool-panel" aria-labelledby="pdfToolTitle">
        <div class="pdf-tool-tabs" role="tablist" aria-label="PDF operation">
          <button class="pdf-tool-tab is-active" id="mergeTab" type="button" data-mode="merge">合并</button>
          <button class="pdf-tool-tab" id="splitTab" type="button" data-mode="split">拆分</button>
        </div>

        <div class="pdf-tool-grid">
          <section class="pdf-tool-card is-active" id="mergePanel" data-panel="merge">
            <div class="pdf-tool-card-head">
              <h2 id="mergeTitle">合并 PDF</h2>
              <span id="mergeBadge">多文件</span>
            </div>
            <label class="pdf-dropzone" for="mergeInput" id="mergeDropzone">
              <input id="mergeInput" type="file" accept="application/pdf,.pdf" multiple>
              <span id="mergeDropText">选择 PDF 文件</span>
            </label>
            <div class="pdf-file-list" id="mergeFileList"></div>
            <div class="pdf-tool-actions">
              <button class="guide-button pdf-primary-button" id="mergeButton" type="button">合并并下载</button>
              <button class="guide-button" id="mergeClearButton" type="button">清空</button>
            </div>
          </section>

          <section class="pdf-tool-card" id="splitPanel" data-panel="split">
            <div class="pdf-tool-card-head">
              <h2 id="splitTitle">拆分 PDF</h2>
              <span id="splitBadge">单文件</span>
            </div>
            <label class="pdf-dropzone" for="splitInput" id="splitDropzone">
              <input id="splitInput" type="file" accept="application/pdf,.pdf">
              <span id="splitDropText">选择 PDF 文件</span>
            </label>
            <div class="pdf-selected-file" id="splitFileInfo"></div>
            <label class="pdf-field-label" for="pageRanges" id="rangeLabel">页码范围</label>
            <input class="pdf-range-input" id="pageRanges" type="text" placeholder="1,3-5,8">
            <div class="pdf-tool-actions">
              <button class="guide-button pdf-primary-button" id="extractButton" type="button">提取范围</button>
              <button class="guide-button" id="splitPagesButton" type="button">拆成单页</button>
              <button class="guide-button" id="splitClearButton" type="button">清空</button>
            </div>
            <div class="pdf-output-list" id="splitOutputList"></div>
          </section>
        </div>

        <div class="pdf-tool-status" id="pdfToolStatus" role="status" aria-live="polite"></div>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="assets/js/pdf-tool.js?v=20260611-pdf-tool"></script>
</body>
</html>
